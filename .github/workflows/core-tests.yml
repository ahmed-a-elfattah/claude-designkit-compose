name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # :plugin needs a local Android Studio, so only :core is configured and tested here.
      - run: ./gradlew :core:test -Dorg.gradle.java.home="$JAVA_HOME" -Dorg.gradle.configureondemand=true --console=plain
